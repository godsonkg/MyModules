name: Fuel regression tests
on:
  pull_request:
    paths: ['Scripts/*fuel*', '.github/workflows/*fuel*']
  push:
    paths: ['Scripts/*fuel*', '.github/workflows/*fuel*']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s Scripts -p 'test_update_fuel.py' -v
      - run: node --test Scripts/test_gd_fuel_price.cjs
