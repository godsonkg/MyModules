name: CheLaiLe module tests
on:
  pull_request:
    paths: ['Scripts/*chelaile*', 'Surge/CheLaiLe/**', '.github/workflows/chelaile_tests.yml']
  push:
    paths: ['Scripts/*chelaile*', 'Surge/CheLaiLe/**', '.github/workflows/chelaile_tests.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: node --test Scripts/test_chelaile_ads.cjs
